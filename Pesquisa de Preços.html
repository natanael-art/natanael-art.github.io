input,button{font-family:inherit;font-size:inherit;}

/* ── App shell ── */
#app{display:flex;flex-direction:column;height:100%;}
.view{display:none;flex:1;flex-direction:column;min-height:0;overflow:hidden;}
.view.active{display:flex;}

/* ── Header ── */

}
.header-title{font-size:17px;font-weight:700;letter-spacing:-0.3px;}
.header-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.header-right{display:flex;align-items:center;gap:6px;}

/* Progress indicator */
.progress-wrap{display:flex;align-items:center;gap:5px;}
.prog-label{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
.prog-bar{width:40px;height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:var(--accent);transition:width .4s;width:0%;}

/* ── Icon buttons ── */
.btn-icon{
  width:38px;height:38px;border-radius:10px;border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:opacity .15s;flex-shrink:0;
}
.btn-icon:active{opacity:.65;}
.btn-primary{background:var(--accent);color:var(--accent-fg);}
.btn-ghost{background:var(--input-bg);color:var(--text);}

/* ── Column headers ── */
.col-headers{
  display:flex;align-items:center;gap:4px;
  padding:7px max(16px,env(safe-area-inset-right,0px)) 7px max(16px,env(safe-area-inset-left,0px));

}
.col-prod-lbl{flex:1;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.col-store{width:88px;flex-shrink:0;}
.store-inp{
  width:100%;border-radius:7px;border:1.5px solid transparent;
  padding:4px 6px;font-size:11px;font-weight:700;text-align:center;
  text-transform:uppercase;letter-spacing:.05em;cursor:text;
}
.store-inp.s1{background:var(--s1-bg);color:var(--s1-fg);}
.store-inp.s2{background:var(--s2-bg);color:var(--s2-fg);}
.store-inp:focus{outline:none;border-color:currentColor;}

/* ── Search ── */
.search-wrap{
  position:relative;
  padding:7px max(16px,env(safe-area-inset-right,0px)) 7px max(16px,env(safe-area-inset-left,0px));
  background:var(--bg);flex-shrink:0;
}
.search-icon{
  position:absolute;left:calc(max(16px,env(safe-area-inset-left,0px)) + 11px);
  top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;
  display:flex;align-items:center;
}
.search-field{
  width:100%;height:40px;
  background:var(--surface);border:1.5px solid var(--border);border-radius:12px;
  padding:0 14px 0 36px;font-size:15px;color:var(--text);
  -webkit-appearance:none;
}
.search-field:focus{outline:none;border-color:var(--accent);}
.search-field::placeholder{color:var(--muted);}

/* ── Product list ── */
.products-scroll{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
}
.product-row{
  display:flex;align-items:center;gap:5px;
  padding:9px 0;border-bottom:1px solid var(--border);
}
.product-row:last-child{border-bottom:none;}
.product-info{flex:1;min-width:0;}
.product-name{

  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}
.product-code{font-size:10px;color:var(--muted);margin-top:2px;}

.price-inp{

  transition:border-color .15s,background .15s,color .15s;

}
.price-inp.p1{background:var(--s1-bg);color:var(--s1-fg);border-color:var(--s1-border);}
.price-inp.p2{background:var(--s2-bg);color:var(--s2-fg);border-color:var(--s2-border);}
.price-inp:focus{outline:none;background:var(--surface);color:var(--text);border-color:var(--accent)!important;}
.price-inp::placeholder{color:var(--muted);opacity:1;}

.empty-state{padding:48px 0;text-align:center;color:var(--muted);font-size:14px;}

/* ── Bottom nav ── */
.bottom-nav{
  display:flex;background:var(--surface);border-top:1px solid var(--border);

}
.nav-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;

.nav-btn.active{color:var(--accent);}
.nav-btn svg{width:21px;height:21px;}

/* ── Edit Products view ── */

.view-title{font-size:17px;font-weight:700;}

/* ── Helpers ── */
const $ = id => document.getElementById(id);
const LS = 'precos_v2';

function getToday(){
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  return `${dd}/${mm}/${d.getFullYear()}`;
}

/* ── State ── */
function defaultState(){
  return {
    stores: ['CORDEIRO','BH'],
    date: getToday(),
    products: PRODUCTS_DEFAULT.map(p=>({...p,prices:['','']})),
    nextId: 200
  };
}

let S;
try {
  const raw = localStorage.getItem(LS);
  S = raw ? JSON.parse(raw) : defaultState();
} catch(e){ S = defaultState(); }

function save(){
  try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){}
}

/* ── Toast ── */
let _toastTimer;
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(()=>el.classList.remove('show'), 2400);
}

/* ── Progress ── */
function updateProgress(){
  const total = S.products.length;
  const filled = S.products.filter(p=>p.prices[0].trim()||p.prices[1].trim()).length;
  const pct = total ? Math.round(filled/total*100) : 0;
  $('prog-label').textContent = `${filled}/${total}`;
  $('prog-fill').style.width = pct+'%';
}

/* ── Header meta ── */
function updateMeta(){
  $('hdr-meta').textContent = S.date + ' · ' + S.stores[0] + ' vs ' + S.stores[1];
}

/* ── Render product list ── */
let _search = '';
function renderList(){
  const q = _search.toLowerCase().trim();
  const list = $('products-list');
  const rows = q
    ? S.products.filter(p=>p.name.toLowerCase().includes(q)||p.code.includes(q))
    : S.products;

  if(!rows.length){
    list.innerHTML = '<div class="empty-state">Nenhum produto encontrado</div>';
    return;
  }

  list.innerHTML = rows.map(p=>`
    <div class="product-row">
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-code">#${p.code}</div>
      </div>
      <input class="price-inp p1" data-id="${p.id}" data-pi="0"
        value="${esc(p.prices[0])}" placeholder="—" autocomplete="off" autocorrect="off"
        inputmode="decimal" spellcheck="false">
      <input class="price-inp p2" data-id="${p.id}" data-pi="1"
        value="${esc(p.prices[1])}" placeholder="—" autocomplete="off" autocorrect="off"
        inputmode="decimal" spellcheck="false">
    </div>`).join('');

  updateProgress();
}

function esc(s){ return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* ── Render edit list ── */
function renderEdit(){
  const list = $('edit-list');
  $('products-count').textContent = S.products.length + ' produtos';
  list.innerHTML = S.products.map(p=>`
    <div class="edit-row">
      <div class="edit-info">
        <div class="edit-name">${esc(p.name)}</div>
        <div class="edit-code">#${p.code}</div>
      </div>
      <button class="btn-del" data-del="${p.id}" title="Remover">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
      </button>
    </div>`).join('');
}

/* ── Price input handling (event delegation) ── */
$('products-list').addEventListener('input', e=>{
  const inp = e.target.closest('.price-inp');
  if(!inp) return;
  const id = +inp.dataset.id;
  const pi = +inp.dataset.pi;
  const p = S.products.find(x=>x.id===id);
  if(p){ p.prices[pi] = inp.value; save(); updateProgress(); }
});

/* ── Store name inputs ── */
function initStoreInputs(){
  const s1 = $('store1'); const s2 = $('store2');
  s1.value = S.stores[0]; s2.value = S.stores[1];
  s1.addEventListener('input',()=>{ S.stores[0]=s1.value.toUpperCase()||'LOJA 1'; save(); updateMeta(); });
  s2.addEventListener('input',()=>{ S.stores[1]=s2.value.toUpperCase()||'LOJA 2'; save(); updateMeta(); });
  s1.addEventListener('blur',()=>{ if(!s1.value.trim()){ s1.value=S.stores[0]; } });
  s2.addEventListener('blur',()=>{ if(!s2.value.trim()){ s2.value=S.stores[1]; } });
}

/* ── Search ── */
$('search-input').addEventListener('input', e=>{
  _search = e.target.value;
  renderList();
});

/* ── Navigation ── */
function switchView(view){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  $('view-'+view).classList.add('active');
  $('nav-'+view).classList.add('active');
  if(view==='products') renderEdit();
  if(view==='search') renderList();
}

document.querySelectorAll('.nav-btn').forEach(btn=>{
  btn.addEventListener('click',()=>switchView(btn.dataset.view));
});

/* ── Add product ── */
$('btn-add-product').addEventListener('click', ()=>{
  const codeEl=$('add-code'), nameEl=$('add-name');
  const name = nameEl.value.trim().toUpperCase();
  const code = codeEl.value.trim();
  if(!name){ nameEl.focus(); return; }
  S.products.push({id:S.nextId++, code:code||'—', name, prices:['','']});
  save();
  renderEdit();
  renderList();
  nameEl.value=''; codeEl.value='';
  nameEl.focus();
  toast('Produto adicionado');
});

$('add-name').addEventListener('keydown', e=>{
  if(e.key==='Enter') $('btn-add-product').click();
});

/* ── Delete product ── */
$('edit-list').addEventListener('click', e=>{
  const btn = e.target.closest('[data-del]');
  if(!btn) return;
  const id = +btn.dataset.del;
  S.products = S.products.filter(p=>p.id!==id);
  save(); renderEdit(); updateProgress();
});

/* ── Export XLSX ── */
$('btn-export').addEventListener('click', ()=>{
  if(typeof XLSX === 'undefined'){ toast('Carregando… tente novamente'); return; }
  try {
    const wb = XLSX.utils.book_new();
    const rows = [
      ['Código Família', 'Família', S.stores[0], S.stores[1]],
      ...S.products.map(p=>[
        p.code,
        p.name,
        p.prices[0].trim() || 'X',
        p.prices[1].trim() || 'X'
      ])
    ];
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:14},{wch:42},{wch:22},{wch:22}];
    // Bold header row
    const headerRange = XLSX.utils.decode_range(ws['!ref']);
    for(let c=0;c<=3;c++){
      const cell = XLSX.utils.encode_cell({r:0,c});
      if(ws[cell]) ws[cell].s = {font:{bold:true}};
    }
    XLSX.utils.book_append_sheet(wb, ws, 'Planilha1');
    const fname = `pesquisa_${S.stores[0]}_${S.stores[1]}_${S.date.replace(/\//g,'-')}.xlsx`;
    XLSX.writeFile(wb, fname);
    toast('✓ Arquivo gerado: ' + fname);
  } catch(err){
    // Fallback: base64 data URI
    try {
      const wb = XLSX.utils.book_new();
      const rows = [
        ['Código Família','Família',S.stores[0],S.stores[1]],
        ...S.products.map(p=>[p.code,p.name,p.prices[0]||'X',p.prices[1]||'X'])
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), 'Planilha1');
      const b64 = XLSX.write(wb,{bookType:'xlsx',type:'base64'});
      const a = document.createElement('a');
      a.href = 'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;base64,'+b64;
      a.download = `pesquisa_${S.date.replace(/\//g,'-')}.xlsx`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      toast('✓ Abrindo arquivo…');
    } catch(e2){ toast('Erro ao exportar — tente pelo desktop'); }
  }
});

/* ── Reset button (long-press header title for 1.5s) ── */
let _resetTimer;
$('view-search').querySelector('.header-title').addEventListener('pointerdown',()=>{
  _resetTimer = setTimeout(()=>{
    if(confirm('Limpar TODOS os preços e começar nova pesquisa?')){
      S.products.forEach(p=>{ p.prices=['','']; });
      S.date = getToday();
      save(); renderList(); updateMeta();
      toast('Preços limpos — nova pesquisa iniciada');
    }
  }, 1500);
});
$('view-search').querySelector('.header-title').addEventListener('pointerup',()=>clearTimeout(_resetTimer));
$('view-search').querySelector('.header-title').addEventListener('pointercancel',()=>clearTimeout(_resetTimer));

/* ── Boot ── */
updateMeta();
initStoreInputs();
renderList();
</script>
